<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" rx="16" />

  <text x="600" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="1">
    MULTIMODAL COST PREDICTION PIPELINE (DVC + MLFLOW)
  </text>
  <text x="600" y="105" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">
    Automated Feature Extraction, Fusion Latent Space &amp; LightGBM Regression with CI/CD
  </text>

  <!-- Box 1: Text -->
  <g transform="translate(80, 160)">
    <rect width="280" height="150" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" />
    <text x="140" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Text Modality</text>
    <text x="140" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">Product Descriptions</text>
    <text x="140" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">SentenceTransformer (384-d)</text>
  </g>

  <!-- Box 2: Image -->
  <g transform="translate(80, 360)">
    <rect width="280" height="150" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="2" />
    <text x="140" y="45" fill="#a855f7" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Vision Modality</text>
    <text x="140" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">75K+ Product Catalog Images</text>
    <text x="140" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Vision Transformer (ViT-B16)</text>
  </g>

  <!-- Arrows to Fusion -->
  <path d="M 360 235 L 470 340" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6" fill="none" />
  <path d="M 360 435 L 470 340" stroke="#a855f7" stroke-width="3" stroke-dasharray="6" fill="none" />

  <!-- Box 3: Fusion & Refiner -->
  <g transform="translate(470, 245)">
    <rect width="280" height="190" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2" />
    <text x="140" y="45" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Custom Fusion Refiner</text>
    <text x="140" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Joint Latent Alignment</text>
    <text x="140" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">PyTorch MLP Projection</text>
    <text x="140" y="150" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Shared Latent Space</text>
  </g>

  <!-- Arrow to Regressor -->
  <path d="M 750 340 L 850 340" stroke="#f59e0b" stroke-width="3" fill="none" />

  <!-- Box 4: LightGBM & MLOps -->
  <g transform="translate(850, 245)">
    <rect width="280" height="190" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" />
    <text x="140" y="45" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Predictor &amp; MLOps</text>
    <text x="140" y="85" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">LightGBM Regressor</text>
    <text x="140" y="115" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">SMAPE: 0.45 Train / 0.47 Val</text>
    <text x="140" y="150" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">DVC &bull; MLflow &bull; GitHub Actions</text>
  </g>

  <rect x="250" y="580" width="700" height="45" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="600" y="608" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">
    Automated Retraining Cut by 40% &bull; Reproducible DVC Versioning &bull; GCP VM Deployment
  </text>
</svg>

